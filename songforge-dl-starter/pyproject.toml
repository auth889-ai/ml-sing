[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "songforge-dl"
version = "0.1.0"
description = "API-free research-grade generative music models"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.3",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
audio = [
  "torchaudio>=2.3",
  "soundfile>=0.12",
  "librosa>=0.10",
  "pretty_midi>=0.2.10",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
