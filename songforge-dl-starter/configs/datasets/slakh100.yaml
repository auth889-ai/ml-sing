# Slakh-100: the first balanced 100-song Slakh subset, sized before download.
# Full sizing evidence and fallbacks: docs/SLAKH100_DESIGN.md
#
# FIDELITY REVISION (2026-08-18, post-listening): the primary source is the
# native 44.1 kHz redux archive, NOT the 16 kHz resample. The listening review
# found a broad realism/fidelity deficit; a realism LoRA trained on 16 kHz
# audio (8 kHz bandwidth ceiling) would learn the band-limit it exists to fix.
# The 16 kHz variant remains listed only as a cheap metadata/analysis source.
dataset_id: slakh100
variant: slakh2100_redux_44k_subset
source_url: https://zenodo.org/records/4599666          # 44.1 kHz FLAC redux, CC-BY-4.0
source_archive: slakh2100_flac_redux.tar.gz             # 104.3 GB (verified via HTTP HEAD)
source_16k_analysis_only: https://zenodo.org/records/7708270  # 48.7 GB; NEVER for realism training
licence: CC-BY-4.0
download_gb: 104.3         # one-time transient on Colab local disk; only ~5 GB is kept
kept_raw_gb: 5
decoded_wav_gb: 25
processed_gb: 16           # 60 s segments at 44.1 kHz, silence-dropped (configs/data/preprocess_44k_lora.yaml)
peak_drive_gb: 22
peak_colab_local_gb: 130   # 104.3 GB archive + extraction workspace; needs a Colab Pro disk
tracks: 100
split_strategy: official_redux_splits   # train picks only from redux train/, etc. Never from omitted/.
splits: {train: 80, val: 10, test: 10}
estimated_mixture_hours: 6.9
estimated_stem_hours: 72   # ~10.5 stems/track, full length, silences included
estimated_processed_hours: 49
estimated_segments: 88000

instrument_stratification:
  # Piano, Guitar, Bass, Drums are in 100% of Slakh mixtures by construction.
  # Rare families get minimum quotas via greedy weighted max-coverage over
  # metadata.yaml inst_class, weights = inverse family prevalence.
  method: greedy_weighted_max_coverage
  eligibility:
    duration_minutes: [3, 6]
    min_stems: 6
    all_stems_rendered: true            # audio_rendered: true on every stem
    target_family_min_lufs: -30         # a quota stem must be audible, not buried
  train_quotas:
    Strings: 40            # covers both 'Strings' and 'Strings (continued)'
    Synth Pad: 25
    Brass: 25
    Reed: 25
    Pipe: 20
    Organ: 20
    Synth Lead: 15
    Chromatic Percussion: 15
  val_test_quotas_each:
    Strings: 4
    other_rare_families: 2

goal: >
  Balanced instrument coverage for the Case A / Case D LoRA lines at 5x the
  BabySlakh corpus, inside a ~15 GB Drive budget. Slakh is synthesized from
  sampled instruments; it can teach spectral balance and arrangement but may
  not teach real-recorded timbre — that caveat is carried into the ablation.

verify_before_download:
  - "Zenodo checksum on the record page must match the downloaded archive"
  - "tar -tzf | head must show train/TrackXXXXX/{mix.flac,stems/,MIDI/,metadata.yaml}"
  - "wget -c to Colab local disk (resumable; Zenodo Range support verified) — never stream on a droppable runtime"
