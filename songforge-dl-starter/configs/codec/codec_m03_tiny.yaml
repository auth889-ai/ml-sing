model:
  sample_rate: 24000
  channels: 1
  base_channels: 16
  latent_dim: 32
  strides: [2, 4, 5, 5]
  num_quantizers: 2
  codebook_size: 128
  commitment_weight: 0.25

training:
  seed: 42
  batch_size: 2
  segment_samples: 24000
  learning_rate: 0.0003
  betas: [0.9, 0.95]
  weight_decay: 0.0
  steps: 20
  grad_clip: 1.0
  amp: true
  waveform_weight: 1.0
  spectral_weight: 1.0
  vq_weight: 1.0
  fft_sizes: [256, 512, 1024]
