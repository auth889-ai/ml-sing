# SongForge Generalization Benchmark — breadth, not the frozen eight.
#
# The eight prompts in prompts.yaml are a frozen REGRESSION benchmark: they
# detect whether a change broke something. They are not the product and they
# are not the target. SongForge is a free-form generator; this file measures
# whether it stays one.
#
# Tier policy:
#   dev      — may be used for prompt engineering and Case C control
#              experiments. NEVER as training audio.
#   heldout  — never used for training, prompt tuning, cherry-picking, or any
#              development decision. Generated and scored only at evaluation
#              time. The first time the model sees these words is the eval.
#
# `expects_instruments` drives the instrument-audibility check and the
# scorecard. It is an evaluation target, NOT a generation switch: nothing in
# SongForge branches on these names to synthesise an instrument.
#
# Acceptance rule for any adapter: improve the weakness it targeted on the
# frozen eight, WITHOUT losing broad capability here. A model that aces eight
# songs and degrades on prompts it has never seen is a regression, not a win.

version: 1
purpose: generalization
defaults:
  seed: 20260818
  duration_seconds: 60
  vocal: null

